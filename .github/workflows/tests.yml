name: Tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # Second supported platform: the suite is the same and fully offline,
          # so one interpreter on macOS is enough to catch CoreMIDI regressions.
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PySide6 needs a few native libs to load headlessly (offscreen Qt).
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Install package
        run: pip install -e '.[dev,ui]'

      # The suite is fully offline. No proprietary res/ or captures/ are present
      # in CI, so the hardware/resource-dependent tests skip automatically.
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
